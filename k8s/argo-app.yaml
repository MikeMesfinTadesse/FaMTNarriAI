apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: famtnarriai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MikeMesfinTadesse/FaMTNarriAI.git
    targetRevision: HEAD
    path: helm/famtnarriai   # <--- Changed from 'k8s' to this
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
